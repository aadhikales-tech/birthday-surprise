<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d9d,#8e44ff);
overflow:hidden;
}

.card{
width:90%;
max-width:420px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
padding:35px;
border-radius:25px;
text-align:center;
color:white;
box-shadow:0 20px 50px rgba(0,0,0,.3);
animation:fade 1s;
}

h1{
font-size:30px;
margin-bottom:15px;
}

p{
opacity:.9;
margin-bottom:25px;
line-height:1.6;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
margin-top:12px;
transition:.3s;
}

.yes{
background:white;
color:#ff2d75;
font-weight:bold;
}

.no{
background:transparent;
border:2px solid white;
color:white;
}

button:hover{
transform:scale(1.05);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>

<body>

<div class="card">

<h1>🎂 Are You The Birthday Girl?</h1>

<p>I made something special only for one person... Is that you? 💖</p>

<button class="yes" onclick="nextPage()">Yes, It's Me 💕</button>

<button class="no" onclick="alert('Oops 😅 This surprise isn't for you.')">No</button>

</div>

<script>

function nextPage(){

document.body.innerHTML=`

<div class="card">

<h1>🥹 Yayyy!!</h1>

<p>I knew you'd click that ❤️<br><br>Let's begin your surprise...</p>

<button class="yes" onclick="alert('Part 2 Coming 😍')">

Continue ➜

</button>

</div>

`;

}

</script>

</body>

</html>
